[book]
title = "Taxudromeio MCP"
description = "Design, access boundaries, and verification of the Rust IMAP MCP server."
language = "en"
src = "book"

[build]
build-dir = "target/anchorbook"
create-missing = false

[preprocessor.anchorbook]
command = "cargo run --quiet --locked --example anchorbook -- md"
config = "anchorbook.toml"
after = ["links"]
